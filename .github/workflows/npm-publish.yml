name: Release Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create release commit (changesets/action/version)
      pull-requests: write # to create release PR (changesets/action/version)
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, which is required for OIDC trusted publishing
          node-version: 24
          # disable cache, to avoid cache poisoning (https://github.com/zizmor.zizmor.sh/audits/#cache-poisoning)
          # package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm run build

      - name: Create Release Pull Request
        uses: changesets/action/version@v2.1.0
        with:
          script: pnpm run version
          commit-message: 'ci: release'
          pr-title: 'ci: release'

      - name: Publish to npm
        uses: changesets/action/publish@v2.1.0
        with:
          script: pnpm exec changeset publish
